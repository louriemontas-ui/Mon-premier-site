<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Lydie MONTAS</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f5f5f5;
      color: #333;
    }

    h1 {
      color: #2c3e50;
      border-bottom: 2px solid #3498db;
      padding-bottom: 10px;
    }

    h2 {
      color: #3498db;
      margin-top: 30px;
    }

    nav a {
      color: #3498db;
      text-decoration: none;
      margin-right: 15px;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    form div {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #2c3e50;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
      font-family: inherit;
      box-sizing: border-box;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
    }

    button {
      background-color: #3498db;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #2980b9;
    }

    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #ccc;
      text-align: center;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>
<body>
    <header>
        <h1>Contactez-moi</h1>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="contact.html">Contact</a>
        </nav>
 </header>

 <main>
    <section>
        <h2>Formulaire de contact</h2>
        <form>
            <div>
                <label for="nom">Nom :</label>
                <input type="text" id="nom" name="nom" required>
            </div>

            <div>
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="sujet">Sujet :</label>
                <input type="text" id="sujet" name="sujet">
            </div>

            <div>
                <label for="message">Message :</label>
                <texterea id="message" name="message" row="5" required></texterea>
            </div>

            <button type="submit">Envoyer</button>
        </form>
    </section>
 </main>

 <footer>
        <p>&copy; 2025 - MONTAS</p>
    </footer>     
</body>
</html>
